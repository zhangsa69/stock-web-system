# 市场研究驾驶舱（MRD）nginx 配置
# 添加到主配置的 server 块中

# MRD 静态文件
location /mrd {
    alias /usr/share/nginx/mrd;
    try_files $uri $uri/ /mrd/index.html;
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# MRD API 代理（复用已有的 /api/ 代理）
# /api/market/* 会自动代理到 backend:8000/api/market/*
