worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # 全局限流：每个 IP 每秒 10 个请求，突发 20
    limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;

    # API 限流：每个 IP 每秒 5 个请求
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # MRD 驾驶舱数据 API 独立限流：首屏 15+ 并发 + 10s 轮询 + 快速重试, 5r/s 会打爆(实测 350+ 次 429)
    limit_req_zone $binary_remote_addr zone=mrd:10m rate=30r/s;

    # HTTP → HTTPS 重定向（Cloudflare Flexible 模式下 Cloudflare 处理 HTTPS，这里保留备用）
    server {
        listen 80;
        server_name _;

        # 全局速率限制
        limit_req zone=global burst=20 nodelay;

        # 前端 SPA 根目录
        root /usr/share/nginx/html;
        index index.html;

        # WebSocket 分流 → Xray（必须放在 location / 之前）
        location /v2-secret {
            if ($http_upgrade != "websocket") {
                return 404;
            }
            proxy_pass http://172.19.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # 内部 stock 业务 API → FastAPI
        location ~ ^/api/(auth|analysis|recharge|admin|market|samples|health)(/|$) {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # MRD 驾驶舱数据 API → node 数据代理 (宿主机 :3000)
        location /api/ {
            limit_req zone=mrd burst=80 nodelay;
            limit_req_status 429;

            proxy_pass http://172.19.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # VNC (noVNC) 反代 → hermes-agent 容器 6080
        location ^~ /vnc/ {
            proxy_pass http://172.19.0.7:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        location ^~ /websockify {
            proxy_pass http://172.19.0.7:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

# MRD 市场研究驾驶舱
        location ^~ /mrd/ {
            alias /usr/share/nginx/mrd/;
            try_files $uri $uri/ /mrd/index.html;
            # manifest / sw.js / 无扩展名文件 → 不缓存(必须先于 .js 长缓存规则, 否则 sw.js 被缓存30天)
            location ~ (manifest\.webmanifest|sw\.js)$ { add_header Cache-Control "no-cache, must-revalidate"; }
            location ~ /icons/ { add_header Cache-Control "no-cache"; }
            # HTML → 不缓存, 始终回源检查新版本(否则浏览器永驻旧 index.html, 新构建不生效)
            location ~ \.html$ { add_header Cache-Control "no-cache, must-revalidate"; }
            # 静态构建产物(*.js/*.css/图片/字体, 文件名带内容 hash) → 长缓存
            location ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }
        }

        # SPA fallback(主站 index.html 也不能长缓存)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}