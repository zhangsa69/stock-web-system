      /* From [Uiverse.io](http://uiverse.io/) by anand_4957 */
      .grid {
        height: 150px;
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        column-gap: 14px;
      }
      .line {
        position: relative;
        width: 7px;
        height: 100%;
      }
      .line::before,
      .line::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 7px;
        border-radius: 7px;
        background-color: #3b44d1;
        animation: upper-line 4s ease-in-out infinite alternate;
      }
      .line::after {
        bottom: 0;
        background-color: #dc5245;
        height: calc(100% - 20px);
        animation: bottom-line 4s ease-in-out infinite alternate;
      }
      /* Delays */
      .line:nth-child(1)::before,
      .line:nth-child(1)::after {
        animation-delay: -0.1s;
      }
      .line:nth-child(2)::before,
      .line:nth-child(2)::after {
